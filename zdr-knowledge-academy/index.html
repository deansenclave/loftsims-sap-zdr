<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ZDR Knowledge Academy</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#e8efff;background:#081224}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{padding:22px max(22px,calc((100vw - 1220px)/2));border-bottom:1px solid #263852;background:#0c1930;display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{font-weight:850;font-size:22px;letter-spacing:-.6px}.brand span{color:#6ee7ce}.sub{color:#a7b9d3;font-size:13px;margin-top:5px}.pill{background:#173d49;color:#9cf5de;padding:9px 14px;border-radius:40px;font-size:12px;font-weight:700}.layout{max-width:1220px;margin:auto;padding:26px 20px;display:grid;grid-template-columns:275px minmax(0,1fr);gap:26px}aside,.panel{background:#101f37;border:1px solid #283c58;border-radius:18px;padding:22px}aside{align-self:start;position:sticky;top:20px}.small{font-size:12px;color:#9eafc8;text-transform:uppercase;letter-spacing:1.5px;font-weight:750}.progress{height:9px;background:#2a3a53;border-radius:20px;overflow:hidden;margin:14px 0 8px}.progress div{height:100%;background:#58dfbf;transition:width .3s}.nav{display:grid;gap:6px;margin-top:20px}.nav button{border:1px solid transparent;text-align:left;background:transparent;color:#b6c5da;padding:11px;border-radius:10px;line-height:1.4}.nav button.active{background:#1a3d51;border-color:#2c6b76;color:#d9fff6}.nav button.done:before{content:'✓ ';color:#68e6c5}.nav button:hover{background:#21354f}.hero{background:linear-gradient(125deg,#17384e,#16213d 68%);border:1px solid #30586d;border-radius:18px;padding:29px;margin-bottom:20px}.eyebrow{color:#6ee7ce;font-weight:750;font-size:12px;letter-spacing:1.5px;text-transform:uppercase}h1{font-size:clamp(27px,4vw,39px);line-height:1.16;margin:12px 0}h2{font-size:23px;margin:0 0 12px}h3{font-size:17px;margin:22px 0 10px}p{line-height:1.65;color:#c0cde0}strong{color:#f3f8ff}.panel{margin-bottom:18px}.callout{border-left:4px solid #67dfc3;background:#183a48;padding:14px 17px;border-radius:8px;color:#dcfdf5;line-height:1.55;margin:17px 0}.warning{border-left-color:#f4bb64;background:#3b302b;color:#ffe7c2}.flow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:20px 0}.node{border:1px solid #50758d;border-radius:12px;padding:14px;background:#1b344b;flex:1;min-width:115px;text-align:center;font-weight:700;font-size:13px}.arrow{color:#68e6c5;font-size:20px}.options{display:grid;gap:10px}.option{background:#172a43;color:#d8e5f5;border:1px solid #3a516d;border-radius:11px;padding:15px;text-align:left}.option:hover{border-color:#69dec2}.option.selected{border-color:#6ee7ce;background:#204c52}.option:disabled{cursor:default}.feedback{margin-top:14px;padding:15px;border-radius:10px;background:#203e4b;border:1px solid #48847f;line-height:1.55}.feedback.bad{background:#40302e;border-color:#93624f}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}button.primary{background:#70e6c7;color:#09243a;border:0;border-radius:10px;padding:13px 20px;font-weight:800}button.secondary{background:#213650;color:#e1ecfb;border:1px solid #42607d;border-radius:10px;padding:12px 18px}button:disabled{opacity:.42;cursor:not-allowed}select{background:#172b45;border:1px solid #4a6380;color:white;padding:13px;border-radius:10px;width:100%;max-width:500px}.muted{color:#a8b9d0;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card{background:#172b44;border:1px solid #344d6c;border-radius:12px;padding:18px}.card h3{margin:0 0 8px}.card p{font-size:14px;margin:0}.meter{font-size:32px;color:#7debd0;font-weight:850}footer{text-align:center;color:#8096b5;padding:25px;font-size:12px}@media(max-width:760px){.layout{display:block}aside{position:static;margin-bottom:20px}.nav{grid-template-columns:repeat(2,1fr)}header{padding:20px}.hero{padding:22px}.arrow{display:none}}
@media print{header,aside,.actions,footer,.option{display:none!important}body{background:white;color:black}.layout{display:block}.panel,.hero{background:white;color:black;border-color:#aaa}p,.muted{color:#333}}
</style></head><body><header><div><div class="brand">ZDR <span>Knowledge Academy</span></div><div class="sub">A practical guide to Zero Data Retention in AI Technology</div></div><div class="pill">STANDALONE • OFFLINE</div></header><div class="layout"><aside><div class="small">Your learning journey</div><div class="progress"><div id="bar"></div></div><div class="muted" id="progressText"></div><div class="nav" id="nav"></div><div class="actions"><button class="secondary" id="reset">Reset progress</button></div></aside><main><section class="hero"><div class="eyebrow" id="eyebrow">WELCOME</div><h1 id="title"></h1><p id="intro"></p></section><section class="panel" id="content"></section><section class="panel" id="activity"></section><section class="panel" id="quiz"></section><div class="actions"><button class="secondary" id="prev">← Previous</button><button class="primary" id="next">Next module →</button></div></main></div><footer>Educational resource • Provider policies and eligibility can change • Verify the applicable service documentation and contract</footer><script>
const modules=[
{title:'Welcome: Your ZDR journey',intro:'No technical background required. Learn how to ask informed questions about where your data goes and what happens to it.',learn:'Zero Data Retention (ZDR) describes a provider-specific arrangement or configuration limiting storage of eligible customer content after processing. Its exact scope varies by provider, product, feature, and agreement.',key:'ZDR does not mean your data is never processed. A service must process the information you send to produce a response.',activity:'Think of ZDR as a question: “What content, if any, is kept after my request is served, by whom, and for how long?”',q:'Which question best captures the goal of ZDR?',opts:['Does the model answer instantly?','What customer content is stored after processing, and under which exceptions?','Does the provider have a chatbot?'],a:1,why:'Retention is about what is stored and for how long, not model speed or the presence of a chatbot.'},
{title:'What happens to a prompt?',intro:'Trace one simple request from your screen to a response.',learn:'When you submit a prompt, it may pass through your app, network, an AI provider, model infrastructure, and optional tools. Each component can have separate logs, storage, and retention rules.',key:'A provider’s ZDR commitment is not automatically a commitment by your application, analytics vendor, or external tool.',flow:['Your device','Your application','AI provider','Response'],activity:'Example: A store manager asks an assistant to summarize a supplier invoice. Even if the AI provider retains no eligible prompt content, the store’s application may still save the uploaded invoice.',q:'Who might retain a copy of the invoice?',opts:['Only the AI model','The application or connected services, depending on their settings','Nobody, because the provider advertises ZDR'],a:1,why:'Each part of the data path needs its own retention assessment.'},
{title:'Training is not retention',intro:'Separate three terms that are often mixed together.',learn:'Model training uses data to update model behavior or parameters. Retention means keeping data or records. Processing means handling data to fulfill a request. A no-training promise does not, by itself, prohibit storage.',key:'“Not used to train” ≠ “not retained” ≠ “not processed.”',activity:'Imagine a service keeps prompts for 30 days for abuse monitoring but does not use them for training. Its no-training statement may be true, while its retention is not zero for those prompts.',q:'A vendor says it never trains on customer prompts. What can you conclude?',opts:['The vendor never stores prompts','The vendor does not use those prompts for training under the stated commitment','The vendor never processes prompts'],a:1,why:'Training commitments and retention controls answer different questions.'},
{title:'Read a ZDR claim carefully',intro:'Learn to look for scope and exceptions rather than relying on a headline.',learn:'A useful ZDR claim identifies eligible services, endpoints or features, customer content covered, excluded metadata, safety and legal exceptions, configuration prerequisites, and contractual terms.',key:'Ask: “ZDR for which data, in which product, with which settings, and with which exceptions?”',activity:'Compare “We offer ZDR” with “For approved accounts using eligible endpoints, specified customer content is not retained after processing, subject to documented exceptions.” The second is more testable.',q:'Which claim gives you more information to validate?',opts:['Our AI is private','ZDR applies to eligible endpoints under documented controls and exceptions','We take security seriously'],a:1,why:'Specific, scoped commitments can be checked against architecture and configuration.'},
{title:'Map every retention point',intro:'A data-flow map reveals where ZDR does and does not apply.',learn:'Potential retention points include browser history, app databases, file uploads, provider logs, conversation state, caches, vector stores, monitoring, backups, and third-party tool services.',key:'End-to-end privacy requires checking each component separately; provider ZDR covers only its defined scope.',flow:['User','App / logs','Model service','Tool / database'],activity:'Tap a retention point below to inspect a common question.',points:[['Application logs','Do logs include prompt or response bodies?'],['File storage','Are uploaded documents deleted, and when?'],['AI provider','Which endpoints, features, and content are covered?'],['External tools','What does each tool or MCP server store?'],['Backups','When do deleted records age out of backups?']],q:'Your provider has ZDR but your app logs full prompts. Is the whole application zero-retention?',opts:['Yes','No','Only on weekends'],a:1,why:'The application’s own logs are an independent retention point.'},
{title:'Compare provider policies',intro:'Explore the questions to ask any AI Technology provider.',learn:'OpenAI, Microsoft, Google, AWS, Anthropic, Salesforce, and other providers have different product boundaries, eligibility processes, defaults, and feature-specific controls. A brand name alone does not establish ZDR.',key:'Always identify the exact service, deployment, endpoint, feature, account eligibility, and current documentation.',provider:true,activity:'Select a provider below. This tutorial gives you a verification checklist, not an unverified claim that ZDR is available on every service.',q:'What is the most reliable unit of comparison?',opts:['Provider logo','Exact service and feature under applicable terms','Marketing slogan'],a:1,why:'Policies may vary within one provider’s product portfolio.'},
{title:'Features and ZDR limitations',intro:'Understand why enabling ZDR can affect product functionality.',learn:'Some features require persistence: stored conversations, file search, retrieval indexes, asynchronous jobs, stateful sessions, and certain monitoring tools. Their compatibility with ZDR depends on the provider’s documented implementation.',key:'Do not assume that a feature is available under ZDR merely because it works without ZDR.',activity:'Scenario: Your team wants a chatbot to remember every previous conversation. Ask where that memory is stored, who controls it, and whether it is inside or outside the provider’s ZDR scope.',q:'What is the first step when a feature needs stored conversation history?',opts:['Assume ZDR covers all storage','Identify the storage owner, retention policy, and provider-specific feature eligibility','Disable all security logs without review'],a:1,why:'Feature-by-feature scope determines whether the intended retention design is achievable.'},
{title:'Build a simple architecture',intro:'Choose components and see how the retention questions change.',learn:'A practical design documents each component, its data types, storage behavior, owner, deletion controls, and evidence. No single toggle can prove an entire architecture retains nothing.',key:'A retention map is more useful than a single “ZDR enabled” badge.',builder:true,activity:'Use the mini architecture builder below to explore the effect of adding optional services.',q:'What is the best evidence for an end-to-end retention claim?',opts:['A screenshot of a vendor homepage','A component-by-component map backed by configurations, policies, and test evidence','A verbal assurance from a salesperson'],a:1,why:'An evidence-based map exposes assumptions and gaps.'},
{title:'Practice with real scenarios',intro:'Apply your knowledge to familiar customer situations.',learn:'In real deployments, the key is to separate verified facts from unknowns and to identify the party responsible for each retention point.',key:'“Unknown” is a useful finding. It signals a question to resolve before making a retention promise.',scenario:true,activity:'Choose a scenario and inspect its retention questions.',q:'A company cannot verify what its external search tool retains. How do you record that?',opts:['Mark the full system ZDR-compliant','Record an unresolved retention gap and request evidence','Assume the AI provider’s policy covers the search tool'],a:1,why:'An unverified third-party dependency remains an open gap.'},
{title:'Final assessment and learning report',intro:'Bring the concepts together and document what you learned.',learn:'You can now distinguish training, processing, retention, provider-specific eligibility, feature limitations, and end-to-end architecture risks.',key:'Completion demonstrates tutorial knowledge, not an independent certification of any provider or customer deployment.',activity:'Review your answers and download a local learning report. Nothing in this tutorial is transmitted to a server.',q:'Which statement is most accurate?',opts:['ZDR always means no data is stored anywhere','A provider’s ZDR scope must be checked alongside application and third-party retention','No-training and ZDR mean the same thing'],a:1,why:'The provider’s defined commitment is one part of a larger data lifecycle.'}
];
const key='zdr-academy-v1';let state;try{state=JSON.parse(localStorage.getItem(key))||{idx:0,answers:{}}}catch{state={idx:0,answers:{}}}let idx=Math.max(0,Math.min(modules.length-1,state.idx||0));const $=id=>document.getElementById(id);function save(){state.idx=idx;localStorage.setItem(key,JSON.stringify(state))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let m=modules[idx],done=Object.keys(state.answers).length;$('bar').style.width=(done/modules.length*100)+'%';$('progressText').textContent=`${done} of ${modules.length} knowledge checks completed`;$('nav').innerHTML=modules.map((v,i)=>`<button class="${idx===i?'active ':''}${state.answers[i]===v.a?'done':''}" data-i="${i}">${String(i+1).padStart(2,'0')} · ${esc(v.title)}</button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{idx=+b.dataset.i;save();render()});$('eyebrow').textContent=`MODULE ${idx+1} / ${modules.length}`;$('title').textContent=m.title;$('intro').textContent=m.intro;$('content').innerHTML=`<h2>Learn</h2><p>${esc(m.learn)}</p><div class="callout"><strong>Remember:</strong> ${esc(m.key)}</div>`+(m.flow?`<div class="flow">${m.flow.map((v,i)=>`<div class="node">${esc(v)}</div>${i<m.flow.length-1?'<span class="arrow">→</span>':''}`).join('')}</div>`:'');let extra='';if(m.points)extra='<div class="grid">'+m.points.map(([t,d])=>`<button class="option" data-detail="${esc(d)}"><strong>${esc(t)}</strong><br><span class="muted">Click to explore</span></button>`).join('')+'</div><div id="detail" class="feedback" hidden></div>';if(m.provider)extra=`<label for="provider" class="muted">Provider to investigate</label><p><select id="provider"><option>OpenAI</option><option>Microsoft</option><option>Google</option><option>AWS</option><option>Anthropic</option><option>Salesforce</option><option>Other provider</option></select></p><div class="feedback" id="providerText"></div>`;if(m.builder)extra=`<div class="grid">${[['logs','Application logs'],['files','Uploaded file storage'],['tools','External tools / MCP'],['vectors','Vector database'],['backup','Backups']].map(([id,t])=>`<label class="card"><input type="checkbox" data-build="${id}"> ${t}</label>`).join('')}</div><div id="buildText" class="feedback">Select components to reveal questions.</div>`;if(m.scenario)extra=`<select id="scenario"><option value="invoice">Grocery invoice assistant</option><option value="health">Sensitive document assistant</option><option value="search">Assistant with external search</option></select><div id="scenarioText" class="feedback"></div>`;$('activity').innerHTML=`<h2>Explore</h2><p>${esc(m.activity)}</p>${extra}`;document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>{let d=$('detail');d.hidden=false;d.textContent=b.dataset.detail});if(m.provider){let update=()=>{$('providerText').innerHTML=`<strong>${esc($('provider').value)}: verification checklist</strong><p>1. Identify exact product, deployment, endpoint, and feature.<br>2. Find current official data-retention and training documentation.<br>3. Confirm ZDR eligibility and account approval requirements.<br>4. Check exclusions, metadata, abuse monitoring, and legal exceptions.<br>5. Check feature restrictions and connected third-party services.<br>6. Record documentation date, contract terms, and test evidence.</p><span class="muted">This offline tutorial does not verify live provider policies.</span>`};$('provider').onchange=update;update()}if(m.builder){document.querySelectorAll('[data-build]').forEach(c=>c.onchange=()=>{let selected=[...document.querySelectorAll('[data-build]:checked')].map(x=>x.parentElement.textContent.trim());$('buildText').textContent=selected.length?`For ${selected.join(', ')}: who stores content, for how long, under what controls, and how can deletion be verified?`:'Select components to reveal questions.'})}if(m.scenario){let update=()=>{$('scenarioText').textContent=({invoice:'Check invoice upload storage, app logs, provider eligibility, supplier data, and backups.',health:'Check sensitive-data authorization, access control, exact provider scope, app storage, and applicable obligations.',search:'Check the search tool’s own content and query retention; provider ZDR does not automatically extend to it.'})[$('scenario').value]};$('scenario').onchange=update;update()}let answer=state.answers[idx];$('quiz').innerHTML=`<div class="small">Knowledge check</div><h2>${esc(m.q)}</h2><div class="options">${m.opts.map((v,i)=>`<button class="option ${answer===i?'selected':''}" data-answer="${i}" ${answer!==undefined?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(v)}</button>`).join('')}</div><div id="feedback">${answer!==undefined?feedback(m,answer):''}</div>${idx===9?'<div class="actions"><button class="primary" id="report">Download learning report</button><button class="secondary" id="print">Print summary</button></div>':''}`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{state.answers[idx]=+b.dataset.answer;save();render()});if($('report'))$('report').onclick=report;if($('print'))$('print').onclick=()=>window.print();$('prev').disabled=idx===0;$('next').textContent=idx===9?'Back to beginning ↻':'Next module →';save()}
function feedback(m,a){return `<div class="feedback ${a===m.a?'':'bad'}"><strong>${a===m.a?'✓ Great work':'Not quite — review this concept'}</strong><br>${esc(m.why)}<br><span class="muted">${a===m.a?'Knowledge check completed.':'You can revisit this module or reset progress to try again.'}</span></div>`}function report(){let score=modules.filter((m,i)=>state.answers[i]===m.a).length;let lines=['ZDR KNOWLEDGE ACADEMY — LEARNING REPORT','Generated: '+new Date().toLocaleString(),`Knowledge checks: ${Object.keys(state.answers).length}/${modules.length}`,`Correct answers: ${score}/${modules.length}`,'','This report records tutorial participation and is not a certification of a provider or deployment.','',...modules.flatMap((m,i)=>[`${i+1}. ${m.title}`,`Answer: ${state.answers[i]===undefined?'Not answered':m.opts[state.answers[i]]}`,`Result: ${state.answers[i]===undefined?'Incomplete':state.answers[i]===m.a?'Correct':'Review needed'}`,'']),'KEY TAKEAWAY: Provider ZDR, no-training commitments, and end-to-end application retention are different.','Verify current official policies and contractual terms for any implementation.'];let blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='zdr-learning-report.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('prev').onclick=()=>{idx=Math.max(0,idx-1);render()};$('next').onclick=()=>{idx=idx===9?0:idx+1;render()};$('reset').onclick=()=>{if(confirm('Reset all tutorial answers and progress?')){state={idx:0,answers:{}};idx=0;save();render()}};render();
</script></body></html>
