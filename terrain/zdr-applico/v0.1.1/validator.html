<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZDR Applico Terr-AI-n — Source Validator v0.1.1</title><style>body{font:16px system-ui;background:#0b1422;color:#ecf2fa;max-width:850px;margin:36px auto;padding:18px}h1{font-size:26px}p{color:#b9c7d7}section{background:#172538;padding:20px;border-radius:12px;margin:18px 0}button,input{font:inherit;padding:9px}button{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}li{margin:10px 0}.pass{color:#75e4a6}.fail{color:#ff9d9d}.pending{color:#fbd27c}</style><h1>ZDR Applico · Terr-AI-n Validator</h1><p>v0.1.1 · Independent source-level assertions · #HumansOnTop</p><section><p>Select the existing <code>versions/v0.6.3/index.html</code> file. No data is uploaded; checks run locally in this browser. This is not a runtime behavioral certification.</p><input id="file" type="file" accept=".html,text/html"><button id="run">Run source checks</button><button id="save">Export JSON</button></section><section><h2>Results</h2><div id="summary">No checks executed.</div><ol id="results"></ol></section><script>
let report=null;
const rules=[
{id:"S01",name:"Flavor detection and normalization surface",patterns:[/flavor/i,/normaliz/i,/probable_match/]},
{id:"S02",name:"AS-IS assessment surface",patterns:[/as-is/i,/assessment/i,/currentJson/]},
{id:"S03",name:"FUTURE recommendation surface",patterns:[/future/i,/recommendation/i]},
{id:"S04",name:"Evidence truth classes",patterns:[/observed/i,/contracted/i,/asserted/i,/proposed/i]},
{id:"S05",name:"Retention and training controls",patterns:[/retention/i,/training_use/i,/logging/i]},
{id:"S06",name:"Human-review terminology",patterns:[/human/i,/unknown/i]},
{id:"S07",name:"JSON export or download surface",patterns:[/JSON/i,/download/i]}
];
document.getElementById("run").onclick=async()=>{
const file=document.getElementById("file").files[0];if(!file){alert("Select the Loft SimS HTML file first.");return}
const src=await file.text();const results=rules.map(r=>({...r,passed:r.patterns.every(p=>p.test(src)),type:"static-source-presence"}));
report={schema:"Terr-AI-n.ValidationReport.v1",terrAIn:"zdr-applico",validator:"v0.1.1",source:{filename:file.name,size:file.size,lastModified:new Date(file.lastModified).toISOString()},executedAt:new Date().toISOString(),results,limits:["Presence does not establish correct behavior","No application execution or UI tests","No evidence of provider ZDR compliance","Immutable release checks require Git history comparison"]};
document.getElementById("summary").textContent=results.filter(r=>r.passed).length+"/"+results.length+" source checks passed; runtime validation pending.";
document.getElementById("results").innerHTML="";
for(const r of results){const li=document.createElement("li");li.className=r.passed?"pass":"fail";li.textContent=r.id+" "+(r.passed?"PASS":"FAIL")+" — "+r.name;document.getElementById("results").append(li)}
};
document.getElementById("save").onclick=()=>{if(!report){alert("Run checks first.");return}const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:"application/json"}));a.download="zdr-applico-source-validation.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script>
