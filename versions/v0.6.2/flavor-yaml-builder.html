<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoftSims · Flavor ZDR YAML Builder</title><style>
:root{--bg:#07101d;--panel:#111d30;--line:#2a3b53;--text:#edf4ff;--muted:#91a4bd;--aqua:#5eead4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:28px}.card{padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--panel);margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:5px;color:var(--muted)}input,select,textarea,button{font:inherit}input,select,textarea{padding:10px;border:1px solid var(--line);border-radius:8px;background:#081423;color:var(--text)}textarea{width:100%;min-height:360px;font:13px/1.5 ui-monospace,monospace}.q{margin-top:9px}.answers{display:flex;gap:6px;flex-wrap:wrap}.answers button,.btn{padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:#081423;color:var(--text);cursor:pointer}.answers button.on,.btn.primary{background:var(--aqua);color:#06101b;font-weight:800}.buttons{display:flex;gap:8px;margin:12px 0}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>Flavor ZDR YAML Builder</h1><p>Standalone generator for any AI Technology system. No data leaves this browser.</p><section class="card"><div class="grid"><label>Product name<input id="product"></label><label>System or product type<input id="system" value="SAP" placeholder="SAP, Salesforce, custom app…"></label><label>Flavor name<input id="flavor" value="sap_zdr"></label><label>Deployment model<select id="deployment"><option>unknown</option><option>cloud</option><option>on_premises</option><option>hybrid</option></select></label><label>Flow ID<input id="flowId" value="ai-data-flow"></label><label>Flow name<input id="flowName" value="AI Technology flow"></label><label>Source system<input id="source"></label><label>Integration layer<input id="integration"></label><label>Destination system<input id="destination"></label><label>Model provider<input id="provider"></label><label>Model and version<input id="model"></label><label>Endpoint region<input id="region"></label></div></section><section id="questions"></section><div class="buttons"><button class="btn primary" id="generate">Generate YAML</button><button class="btn" id="download">Download YAML</button></div><textarea id="output" readonly placeholder="Generated flavor-specific YAML"></textarea><p>#HumansOnTop · Human decision-makers retain final authority.</p></main><script>
const $=s=>document.querySelector(s),qs=['Are prompts, retrieved context, attachments, embeddings or responses retained?','Is customer content used for model training, evaluation, tuning or service improvement?','Can security or abuse monitoring retain or expose content?','Are the exact model provider, model, version and endpoint identified?','Are all subprocessors that can receive or access content or metadata identified?','Are all storage, processing, backup and remote-access locations documented?','Can content enter application, integration, audit or observability logs?','Are logs metadata-only, with sensitive content redacted?','Are retention periods for backups, replicas, caches, queues and DR copies documented and compatible with ZDR?','Can content logging be disabled and enforced in every environment?','Is deletion behavior at service termination documented and compatible with ZDR?','Does deletion propagate to replicas, caches, logs, backups and subprocessors?','Is ZDR binding for this exact service plan, model, region and flow?','Is contract precedence documented for conflicts among system, provider and customer terms?','Does the assessed application persist prompts, responses, traces or feedback?'],state=Object.fromEntries(qs.map((_,i)=>['Q'+String(i+1).padStart(2,'0'),'unknown']));
$('#questions').innerHTML=qs.map((q,i)=>{let id='Q'+String(i+1).padStart(2,'0');return `<article class="card q"><b>${id} · ${q}</b><div class="answers">${['yes','no','partial','unknown','not_applicable'].map(v=>`<button data-id="${id}" data-v="${v}" class="${v==='unknown'?'on':''}">${v.replaceAll('_',' ')}</button>`).join('')}</div></article>`}).join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{state[b.dataset.id]=b.dataset.v;b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});
function yaml(){let slug=($('#flavor').value||$('#system').value||'custom').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''),line=['specification:','  id: "loftsims.flavor.zdr-assessment"','  version: "1.0.0"','  principle: "#HumansOnTop"','  flavor_name: '+JSON.stringify(slug),'  system_type: '+JSON.stringify($('#system').value),'product:','  product_name: '+JSON.stringify($('#product').value),'installation:','  deployment_model: '+JSON.stringify($('#deployment').value),'data_flow:','  flow_id: '+JSON.stringify($('#flowId').value),'  name: '+JSON.stringify($('#flowName').value),'  source_system: '+JSON.stringify($('#source').value),'  integration_layer: '+JSON.stringify($('#integration').value),'  destination_system: '+JSON.stringify($('#destination').value),'  model_provider: '+JSON.stringify($('#provider').value),'  model: '+JSON.stringify($('#model').value),'  endpoint_region: '+JSON.stringify($('#region').value),'assessment_questions:'];qs.forEach((q,i)=>{let id='Q'+String(i+1).padStart(2,'0');line.push('  - id: '+id,'    question: '+JSON.stringify(q),'    answer: '+state[id])});return line.join('\n')+'\n'}$('#generate').onclick=()=>$('#output').value=yaml();$('#download').onclick=()=>{let text=yaml();$('#output').value=text;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/yaml'}));a.download=($('#flavor').value||'custom')+'_ZDR_Assessment.yaml';a.click()};
</script></body></html>
